server:
  port: 8080
  tomcat:
    max-http-post-size: -1  # disable Tomcat POST size limit

spring:
  servlet:
    multipart:
      max-file-size: 3GB
      max-request-size: 3GB
      file-size-threshold: 0  # write to disk immediately to avoid memory issues

sftp:
  host: localhost
  port: 2222
  username: root
  password: password
  upload-dir: /upload
  connection-timeout: 10000
  channel-timeout: 10000
  strict-host-checking: false